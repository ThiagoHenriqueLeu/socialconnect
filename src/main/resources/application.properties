# ====================================================
# SocialConnect API - Configuração de Desenvolvimento
# ====================================================

# Nome da aplicação
spring.application.name=socialconnect-api

# Porta do servidor
server.port=8080

# ===========================================================
# Banco de Dados (H2 em memória para desenvolvimento rápido)
# ===========================================================
spring.datasource.url=jdbc:h2:mem:socialconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================
# Dialeto do H2

# Flyway cria o esquema; Hibernate apenas verifica o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8
spring.data.web.pageable.max-page-size=100

# Exibe as queries SQL no console (útil para aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Console H2 (Acesso via navegador para inspecionar dados)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Flyway (Migrations)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# SpringDoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
